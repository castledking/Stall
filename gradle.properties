# Stall build properties. See docs/PLAN.md section 2 for the evidence behind each version.
version = 1.0.0
group = codes.castled

# --- Toolchain ------------------------------------------------------------------------------------
# Minecraft 26.x requires Java 25, so every module compiles to Java 25.
java_version = 25

# --- Minecraft and Fabric -------------------------------------------------------------------------
# Stall targets 26.3 only for now.
minecraft_version = 26.3
fabric_minecraft_dependency = ~26.3
fabric_loader_version = 0.19.5
# What Fabric API for 26.3 itself requires.
fabric_loader_minimum = 0.19.3
fabric_api_version = 0.162.0+26.3

# --- Spigot / Paper -------------------------------------------------------------------------------
# The plugin compiles against the shared Spigot API and also runs on Paper.
spigot_api_version = 26.3-R0.1-SNAPSHOT

# Loom 1.18 builds unobfuscated 26.x without remapping.
loom_version = 1.18.4

org.gradle.jvmargs = -Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
