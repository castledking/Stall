# Stall settings.
#
# Missing settings are filled in on startup or `/stall admin reload`, and your own settings are kept.
# Keep config-version as it is: Stall uses it to update this file cleanly when new versions come out.
config-version: 2

# --- Shops -----------------------------------------------------------------------------------------
shops:
  # How many shops a player can own without a `stall.limit.<n>` permission.
  # Set to 0 if players must be given a `stall.limit.<n>` permission before they can own any.
  default-limit: 3

  # The highest `stall.limit.<n>` permission tier checked (1 to 1000).
  # Players with `stall.limit.unlimited` can always own any number of shops.
  max-limit-tier: 100

  # Most offers one shop can have, from 1 to 6 (one menu row per offer).
  max-offers: 6

  # Minimum ticks between the first and second Q press when removing an offer (15 ticks = 0.75s, so
  # holding Q down doesn't delete it by accident). Set to 0 for instant second-press confirmation.
  offer-remove-cooldown-ticks: 15

  # Which containers can be turned into shops.
  containers:
    barrels: true
    chests: true
    trapped-chests: true
    shulker-boxes: true
    # Whether a chest shop can be a double chest (54 slots of stock).
    double-chests: true
    # Whether players with `stall.barrel.large` get 54-slot barrel shops.
    large-barrels: true
    # Whether players with `stall.shulker.large` get 54-slot shulker box shops.
    large-shulkers: true

  # Worlds where new shops cannot be created, by world name or dimension id
  # (such as "world", "world_nether", "world_the_end" or "minecraft:the_end").
  # Existing shops in these worlds still work.
  disabled-worlds: []

  # Custom block models from CraftEngine, Nexo, or Oraxen supported as shops.
  # Key is the custom block identifier (e.g. "market_stall" or "nexo:stall").
  # Size is the stock capacity in slots (9, 18, 27, 36, 45, or 54; defaults to 27).
  # Title is the custom display title shown when opening the shop stock.
  # Examples:
  #   custom-blocks:
  #     nexo:market_stall:
  #       size: 54
  #       title: "Market Stall"
  #     oraxen:pedestal: 18
  #     craftengine:display_stand:
  #       size: 27
  custom-blocks: {}

# --- Protection ------------------------------------------------------------------------------------
protection:
  # Keep explosions from destroying shop containers.
  explosions: true

  # Keep hoppers and hopper minecarts from pulling stock out of shops.
  hopper-extract: true

  # Let hoppers push items into shops to restock them.
  hopper-insert: true

# --- Trades ----------------------------------------------------------------------------------------
trades:
  # Minimum ticks between buy clicks from the same player, so a double-click doesn't buy twice.
  buy-cooldown-ticks: 4

  # Tell the shop's owner in chat when they are online and someone buys from their shop.
  notify-owner: false

  # How often open shop menus redraw to show stock changes, in ticks (20 ticks = 1 second).
  menu-refresh-ticks: 20

# --- Commands --------------------------------------------------------------------------------------
commands:
  # Additional aliases for the /stall command (for example: ["shop", "market"] or "shop").
  # /stall is always registered.
  aliases: []

# --- Tokens ----------------------------------------------------------------------------------------
tokens:
  # The item ID used for the stall token (for example: "paper", "player_head", "feather", "gold_nugget").
  item: "paper"

  # CustomModelData integer applied to the token item (0 to disable).
  custom-model-data: 0

  # Base64 texture string (e.g. from minecraft-heads.com dev 64bit Value) applied when item is "player_head".
  skull-texture: ""

  # Most tokens `/stall token` or `/stall admin give` hands out at once (1 to 64).
  max-per-command: 64

  # Whether creative-mode players use up the token in their hand when creating a shop.
  consume-in-creative: false

  # Give the token item an enchantment glint.
  glint: true

# --- Menu Icons ------------------------------------------------------------------------------------
# Material or item IDs used for shop menu buttons, empty slots and status panes.
# Uses standard item IDs such as "barrier", "lime_dye", "light_gray_stained_glass_pane".
menu:
  icons:
    # Empty offer slot placeholders in the owner menu.
    empty-cost-slot: "light_gray_stained_glass_pane"
    empty-reward-slot: "light_gray_stained_glass_pane"

    # Offer removal button in the owner menu.
    remove-button: "barrier"

    # Status panes in the owner and buyer menus.
    status-available: "lime_stained_glass_pane"
    status-out-of-stock: "red_stained_glass_pane"
    status-cannot-afford: "orange_stained_glass_pane"
    status-inventory-full: "orange_stained_glass_pane"
    status-shop-full: "gray_stained_glass_pane"
    status-incomplete: "gray_stained_glass_pane"
    status-unavailable: "gray_stained_glass_pane"
    status-new-offer: "white_stained_glass_pane"

    # Buy buttons in the buyer menu.
    buy-available: "lime_dye"
    buy-unavailable: "gray_dye"
